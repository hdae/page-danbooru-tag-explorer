packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  comlink: ^4.4.2
  fuse.js: ^7.3.0
  "@tanstack/react-query": ^5.100.11
  papaparse: ^5.5.3
  sonner: ^2.0.7
  vite-plugin-comlink: ^5.3.0
  "@types/papaparse": ^5.5.2
  tailwindcss: ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  shadcn: ^4.8.0
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  "@base-ui/react": ^1.5.0
  lucide-react: ^1.16.0
  "@fontsource-variable/geist": ^5.2.9
  next-themes: ^0.4.6
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  msw: false
